<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atlantean Gardens · The Living Atlas</title>
  <!-- GitHub Pages shows this page for any address that doesn't exist, such as the retired
       about, shop and members pages. It sends visitors to the Living Atlas, keeping any #hash.
       The site lives at / on atlanteangardens.org (and under /<repo>/ if ever served from github.io). -->
  <meta name="robots" content="noindex">
  <script>
    var home = /\.github\.io$/.test(location.hostname) ? "/" + location.pathname.split("/")[1] + "/" : "/";
    location.replace(home + location.search + location.hash);
  </script>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; box-sizing: border-box;
           background: #0e1b17; color: #ecdcb0; font-family: Georgia, "Times New Roman", serif; text-align: center; }
    a { color: #e9c45a; font-size: 1.15rem; letter-spacing: .04em; }
  </style>
</head>
<body>
  <p><a href="/">Enter the Living Atlas</a></p>
</body>
</html>
