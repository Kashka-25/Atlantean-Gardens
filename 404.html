<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atlantean Gardens · The Living Atlas</title>
  <!-- GitHub Pages shows this page for any address that doesn't exist. It sends visitors on into the
       Living Atlas:
       - Card short links from the printed QR codes, /C/<WEB ID> (e.g. /C/TERPGASM, in capitals so the
         QR code stays small; /c/terpgasm works too), open that card: /#/cards/<web id>. A card the
         Atlas doesn't have yet opens the Strains list instead.
       - Anything else (e.g. the retired about, shop and members pages) goes to the Atlas, keeping any #hash.
       The site lives at / on atlanteangardens.org (and under /<repo>/ if ever served from github.io). -->
  <meta name="robots" content="noindex">
  <script>
    (function () {
      var path = location.pathname, home = "/";
      if (/\.github\.io$/.test(location.hostname)) { home = "/" + path.split("/")[1] + "/"; path = path.slice(home.length - 1); }
      var card = path.match(/^\/c\/([a-z0-9-]+)\/?$/i);
      location.replace(card ? home + "#/cards/" + card[1].toLowerCase() : home + location.search + location.hash);
    })();
  </script>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; box-sizing: border-box;
           background: #0e1b17; color: #ecdcb0; font-family: Georgia, "Times New Roman", serif; text-align: center; }
    a { color: #e9c45a; font-size: 1.15rem; letter-spacing: .04em; }
  </style>
</head>
<body>
  <p><a href="/">Enter the Living Atlas</a></p>
</body>
</html>
