<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Atlantean Gardens · The Living Atlas</title>
  <meta name="description" content="Atlantis Rising — Myth Made Medicine. A dream preview of the Living Atlas of Atlantean Gardens.">
  <meta name="theme-color" content="#0b1a22">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/atlas.css?v=35">
</head>
<body>
  <!-- Threshold: the first thing a traveller sees -->
  <section id="threshold" class="threshold" aria-label="Welcome">
    <div class="threshold__bg" aria-hidden="true"></div>
    <div class="threshold__mist" aria-hidden="true"></div>
    <div class="threshold__inner">
      <img class="threshold__emblem" src="assets/logo-emblem.png" alt="The Atlantean Gardens emblem: a golden tree with spiralling branches above waves and green hills, in a gold-rimmed circle">
      <p class="eyebrow">The Atlantean Archives</p>
      <h1 class="threshold__title"><img class="threshold__wordmark" src="assets/logo-wordmark-light.png" alt="Atlantean Gardens"></h1>
      <p class="threshold__tag">Atlantis Rising · Myth Made Medicine</p>
      <div class="threshold__intro" id="threshold-intro"></div>
      <button class="btn btn--gold" id="enter">Enter the Garden</button>
      <p class="threshold__note">A work in progress · the Garden is always growing</p>
    </div>
  </section>

  <div class="app" id="app" hidden>
    <aside class="rail" aria-label="Atlas navigation">
      <div class="rail__brand">
        <button class="rail__toggle" id="rail-toggle" aria-expanded="true" aria-controls="rail-body" aria-label="Tuck the menu away"><img src="assets/logo-emblem.png" alt=""></button>
        <a class="rail__name" href="#/atlas"><strong>Atlantean Gardens</strong><em>The Living Atlas</em></a>
      </div>
      <div class="rail__body" id="rail-body">
        <nav class="rail__nav" id="nav"></nav>
        <div class="rail__journey" id="rail-journey"></div>
      </div>
    </aside>

    <main class="stage" id="stage" tabindex="-1"></main>

    <nav class="dock" id="dock" aria-label="Atlas navigation"></nav>
  </div>

  <div class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer__scrim" data-close></div>
    <article class="drawer__panel" role="dialog" aria-modal="true" aria-labelledby="drawer-title" id="drawer-panel"></article>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="data/world.js?v=35"></script>
  <script src="js/hiding.js?v=35"></script>
  <script src="js/messages.js?v=35"></script>
  <script src="js/atlas.js?v=35"></script>
</body>
</html>
